# Render Blueprint: API (NestJS). The client is deployed on Vercel (see vercel.json).
services:
  - type: web
    name: ruth-api
    runtime: node
    plan: free
    buildCommand: npm i -g pnpm@11.25.0 && pnpm install --frozen-lockfile && pnpm --filter server build
    startCommand: cd server && node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: TRUST_PROXY
        value: "true"
      - key: MONGODB_URI
        sync: false # pasted by the user in the Render dashboard
      - key: CLIENT_URL
        sync: false # the Vercel URL, e.g. https://ruth-xxx.vercel.app
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SAME_SITE
        value: lax
